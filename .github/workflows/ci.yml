name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Linting
        run: flake8 . --exclude=baseline_model,data,__pycache__
      - name: Run tests
        run: PYTHONPATH=. pytest --maxfail=1 --disable-warnings -v 
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t metalytics-backend-test .
      - name: Run container and test health endpoint
        run: |
          docker run -d -p 8000:8000 --name metalytics-backend-test metalytics-backend-test
          sleep 10
          curl --fail http://localhost:8000/health || (docker logs metalytics-backend-test && exit 1)
      - name: Cleanup
        if: always()
        run: docker rm -f metalytics-backend-test || true 
