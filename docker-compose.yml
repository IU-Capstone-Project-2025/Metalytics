version: '3.9'
env_file: .env

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: metalytics
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - metalytics_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - metalytics_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      - metalytics_net
    volumes:
      - ./frontend:/app
      - /app/node_modules

  data-updater:
    environment:
        - DB_HOST=db
        - DB_PORT=5432
        - DB_NAME=metalytics
        - DB_USER=${DB_USER:-postgres}          # must match POSTGRES_USER
        - DB_PASSWORD=${DB_PASSWORD}  # must match POSTGRES_PASSWORD
    build:
      context: ./data
      dockerfile: Dockerfile
    
    networks:
      - metalytics_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
  
networks:
  metalytics_net:
    driver: bridge
volumes:
  postgres_data: